name: Publish Production Artifacts

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref that owns the release artifacts.
        required: false
        type: string
        default: v4.x
      app_version:
        description: Coolify app version to publish.
        required: true
        type: string
      helper_version:
        description: Coolify helper version to publish.
        required: true
        type: string
      realtime_version:
        description: Coolify realtime version to publish.
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify published manifests
        run: |
          inspect_manifest() {
            local image="$1"
            local attempts=0
            until docker buildx imagetools inspect "$image" >/dev/null 2>&1; do
              attempts=$((attempts + 1))
              if [ "$attempts" -ge 10 ]; then
                echo "Manifest not available: $image"
                return 1
              fi
              sleep 15
            done
          }

          inspect_manifest "ghcr.io/loccen/coolify:${{ inputs.app_version }}"
          inspect_manifest "ghcr.io/loccen/coolify-helper:${{ inputs.helper_version }}"
          inspect_manifest "ghcr.io/loccen/coolify-realtime:${{ inputs.realtime_version }}"

      - name: Checkout artifacts repository
        uses: actions/checkout@v5
        with:
          repository: loccen/coolify-zh-artifacts
          ref: main
          token: ${{ secrets.ARTIFACTS_REPO_TOKEN }}
          path: artifacts-repo
          persist-credentials: false

      - name: Prepare production artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p artifacts-repo/coolify artifacts-repo/json
          cp docker-compose.yml artifacts-repo/coolify/docker-compose.yml
          cp docker-compose.prod.yml artifacts-repo/coolify/docker-compose.prod.yml
          cp .env.production artifacts-repo/coolify/.env.production
          cp scripts/install.sh artifacts-repo/coolify/install.sh
          cp scripts/restore-coolify-instance.sh artifacts-repo/coolify/restore-coolify-instance.sh
          cp scripts/upgrade.sh artifacts-repo/coolify/upgrade.sh
          cp templates/service-templates-latest.json artifacts-repo/coolify/service-templates-latest.json
          jq \
            --arg app_version "${{ inputs.app_version }}" \
            --arg helper_version "${{ inputs.helper_version }}" \
            --arg realtime_version "${{ inputs.realtime_version }}" \
            '.coolify.v4.version = $app_version
            | .coolify.helper.version = $helper_version
            | .coolify.realtime.version = $realtime_version' \
            versions.json > artifacts-repo/coolify/versions.json
          gh api repos/${{ github.repository }}/releases?per_page=30 > artifacts-repo/json/releases.json
          touch artifacts-repo/.nojekyll

      - name: Commit and push production artifacts
        run: |
          cd artifacts-repo
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          if git status --short | grep . >/dev/null; then
            git add coolify json .nojekyll
            git commit -m "chore: 同步 production artifacts"
            git push https://x-access-token:${{ secrets.ARTIFACTS_REPO_TOKEN }}@github.com/loccen/coolify-zh-artifacts.git HEAD:main
          else
            echo "No production artifact changes detected."
          fi
